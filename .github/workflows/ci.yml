# CI für GitHub Actions (Forks und Spiegel auf GitHub). Gleiche Prüfungen wie .gitea/workflows/ci.yml;
# Unterschied: Jobs laufen direkt auf der VM, Postgres ist daher über localhost erreichbar.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: lykos
          POSTGRES_PASSWORD: lykos
          POSTGRES_DB: lykos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lykos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL: postgres://lykos:lykos@localhost:5432/lykos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  client:
    name: Client (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
