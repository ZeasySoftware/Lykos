# CI für Gitea/Forgejo Actions. Runner-Label über die Actions-Variable LYKOS_RUNNER (Repo/Org/Instanz),
# ohne Variable "ubuntu-latest" – so laufen die Jobs auch in Forks. Jobs laufen im Container, daher erreicht
# der Server den Postgres-Service unter dem Hostnamen "postgres". GitHub nutzt .github/workflows/ci.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (fmt, clippy, test)
    runs-on: ${{ vars.LYKOS_RUNNER || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: lykos
          POSTGRES_PASSWORD: lykos
          POSTGRES_DB: lykos
        options: >-
          --health-cmd "pg_isready -U lykos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL: postgres://lykos:lykos@postgres:5432/lykos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  client:
    name: Client (lint, build)
    runs-on: ${{ vars.LYKOS_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
